<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230" role="img" aria-label="Room Audio Reconstruction - made by Nikolay Rangelov">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b0b0d"/>
      <stop offset="0.62" stop-color="#121214"/>
      <stop offset="1" stop-color="#2a0b0f"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e63946" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#e63946" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#e63946" stop-opacity="0.8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e63946" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#e63946" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="1.5" y="1.5" width="897" height="227" rx="18" fill="url(#bg)" stroke="url(#edge)" stroke-width="2"/>

  <!-- text -->
  <text x="48" y="78" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#e63946">Room Audio Reconstruction</text>
  <text x="50" y="108" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5" fill="#d7d7db">Recreating a room from nothing but the sound of a clap or a yell</text>
  <rect x="50" y="126" width="54" height="3" rx="1.5" fill="#e63946"/>
  <text x="50" y="162" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#f2f2f4">Made by Nikolay Rangelov</text>
  <text x="50" y="190" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#8e8e96">Mentor: Dimitar Rangelov   ·   UKTC Pravets</text>

  <!-- icon: a clap in a room, sound rings bouncing off the walls -->
  <g transform="translate(745 115)">
    <circle r="92" fill="url(#glow)"/>
    <path d="M-70 -62 h-14 v14 M70 -62 h14 v14 M-70 62 h-14 v-14 M70 62 h14 v-14" fill="none" stroke="#f2f2f4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
    <rect x="-62" y="-50" width="124" height="100" rx="6" fill="none" stroke="#e63946" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="5 5"/>
    <circle r="54" fill="none" stroke="#e63946" stroke-opacity="0.25" stroke-width="2"/>
    <circle r="38" fill="none" stroke="#e63946" stroke-opacity="0.5" stroke-width="3"/>
    <circle r="22" fill="none" stroke="#e63946" stroke-width="4"/>
    <circle r="7" fill="#e63946"/>
    <circle cx="80" cy="-78" r="5" fill="#e63946"/>
  </g>
</svg>
