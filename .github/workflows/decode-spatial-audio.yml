# Decodes the iPhone Spatial Audio (APAC) track of every video in data/videos on a GitHub-hosted Mac
# and publishes the 4-channel ambisonics WAVs as the "spatial-audio" artifact.
# Runs automatically when videos or the decoder change, or manually from the Actions tab.
name: Decode Spatial Audio

on:
  push:
    paths:
      - "data/videos/**"
      - "tools/decode_spatial_audio.swift"
      - ".github/workflows/decode-spatial-audio.yml"
  workflow_dispatch:

jobs:
  decode:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Show system
        run: sw_vers && swift --version

      - name: Decode APAC to first-order ambisonics
        shell: bash
        run: |
          set -o pipefail
          swift tools/decode_spatial_audio.swift data/videos data/spatial 2>&1 | tee decode.log

      - name: Publish decoder log
        if: always()
        shell: bash
        run: |
          if [ -f decode.log ]; then
            msg=$(tail -c 3500 decode.log | tr -d '\r' | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::notice title=Decoder log::${msg}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: spatial-audio
          path: data/spatial/*.wav
          if-no-files-found: error
